name: check

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check

  frontend:
    needs: cross-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/git-ai-control-panel/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend/git-ai-control-panel
        run: npm ci
      - name: Check frontend
        working-directory: frontend/git-ai-control-panel
        run: npm run lint
      - name: Build frontend
        working-directory: frontend/git-ai-control-panel
        run: npm run build
      - name: Verify committed frontend build
        run: git diff --exit-code -- static
